[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "toy-graph"
version = "0.1.0"
description = "Toy Graph Learning package with DeepWalk and node2vec"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "networkx>=2.6",
    "gensim>=4.0",
    "joblib>=1.0",
    "numpy>=1.20",
]

[project.optional-dependencies]
examples = [
    "matplotlib>=3.5",
    "pandas>=1.3",
    "seaborn>=0.11",
    "scikit-learn>=1.0",
]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["toy_graph*"]

[tool.pytest.ini_options]
testpaths = ["test"]
